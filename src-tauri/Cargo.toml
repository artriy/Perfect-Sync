[package]
name = "app"
version = "0.1.2"
description = "Among Us BepInEx mod manager with shareable lobby mod-sync"
authors = ["artriy"]
license = "MIT"
repository = "https://github.com/artriy/Perfect-Sync"
edition = "2021"
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
perfect-sync-core = { path = "../core" }
atomicwrites = "0.4.4"
secrecy = "0.8"
sha2 = "0.10"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
regex = "1"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "2.3.3", default-features = false, features = ["platform-windows"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "2.3.3", default-features = false, features = ["platform-macos"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "2.3.3", default-features = false, features = ["linux-secret-service"] }

[dev-dependencies]
tempfile = "3"
