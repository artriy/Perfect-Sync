name: ci

on:
  pull_request:
  push:

permissions:
  contents: read
  checks: write

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-22.04
          - macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Audit Rust dependencies (ignore inactive rust_decimal rkyv feature)
        if: runner.os == 'Linux'
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2026-0235

      - name: Install Linux Tauri libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit frontend production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Type-check frontend
        run: pnpm typecheck

      - name: Build frontend
        run: pnpm build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --all-targets --all-features --locked
