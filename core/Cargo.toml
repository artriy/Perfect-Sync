[package]
name = "perfect-sync-core"
version = "0.1.6"
edition = "2021"
rust-version.workspace = true
description = "Core logic for Perfect Sync (catalog, lobby codec, resolver, loader)"
license = "MIT"
repository = "https://github.com/artriy/Perfect-Sync"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
base64 = "0.22"
crc32fast = "1"
regex = "1"
plist = "1"
thiserror = "2"
ureq = { version = "2", features = ["json"] }
zip = "2"
url = "2"
semver = "1"
percent-encoding = "2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
